<!doctype html>
<html lang="es" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0D10" />
  <link rel="preload" href="/src/assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Aplicación de seguimiento Traker" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/pwa-192x192.png" />
    <title>Traker</title>
    <script>
      const params = new URLSearchParams(window.location.search)
      const redirectPath = params.get('p')

      if (redirectPath) {
        const url = new URL(window.location.href)
        const nextPath = redirectPath.startsWith('/') ? redirectPath : `/${redirectPath}`

        url.searchParams.delete('p')
        window.history.replaceState(null, '', `${url.pathname.replace(/\/$/, '')}${nextPath}${url.search ? `?${url.searchParams.toString()}` : ''}`)
      }
    </script>
  </head>
  <body>
    <!--
    THESIS: El piloto demuestra que los datos personales pueden pasar entre dos dispositivos sin duplicarse, perderse ni revivir después de un borrado.
    OWN-WORLD: Infraestructura invisible de Aurora 2; conserva la experiencia actual y añade procedencia, versiones y rollback sin exponer contenido personal.
    STORY: La persona edita, pausa, registra, elimina, restaura y reclama; cada segundo dispositivo converge o presenta un conflicto explícito.
    FIRST VIEWPORT: Hoy no cambia durante el piloto; el lector heredado sigue autoritativo y traker-v2 permanece detrás de una bandera apagada por defecto.
    FORM: Extensión técnica de PostgreSQL, RPC e IndexedDB con reporte de calidad y matriz de piloto; no introduce componentes visuales nuevos.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
