<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="bg192" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#141810"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </radialGradient>
    <filter id="glow192">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" fill="url(#bg192)"/>

  <!-- T monogram — neon lime -->
  <g filter="url(#glow192)" fill="#C6FF00">
    <!-- Horizontal bar -->
    <rect x="34" y="40" width="124" height="22" rx="11"/>
    <!-- Vertical stem -->
    <rect x="85" y="62" width="22" height="90" rx="11"/>
  </g>
</svg>
