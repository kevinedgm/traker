<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg512" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#141810"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </radialGradient>
    <filter id="glow512">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg512)"/>

  <!-- T monogram — neon lime -->
  <g filter="url(#glow512)" fill="#C6FF00">
    <!-- Horizontal bar -->
    <rect x="92" y="106" width="328" height="58" rx="29"/>
    <!-- Vertical stem -->
    <rect x="227" y="164" width="58" height="242" rx="29"/>
  </g>
</svg>
